<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Congé</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-4xl w-full bg-white rounded-lg shadow-md flex">
        <div id="loginForm" class="w-full p-6 hidden">
            <h1 class="text-2xl font-bold mb-4 text-center">Connexion</h1>
            <form id="login" class="space-y-4">
                <div>
                    <label for="username" class="block text-gray-700">Nom d'utilisateur:</label>
                    <input type="text" id="username" name="username" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-gray-700">Mot de passe:</label>
                    <input type="password" id="password" name="password" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Se connecter</button>
            </form>
        </div>
        <!-- Formulaire à gauche -->
        <body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
            <div class="max-w-4xl w-full bg-white rounded-lg shadow-md flex flex-col items-center">
                <!-- Bouton pour afficher le formulaire de connexion -->
                <div id="Bienvenue" class="w-full p-6 text-center">
                    <h1 class="text-2xl font-bold mb-4">Bienvenue sur le site de Demande de Congé</h1>
                    <button id="showLoginButton" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                        Se connecter
                    </button>
                </div>
            <h1 class="text-2xl font-bold mb-4">Déposer une Demande de Congé</h1>
            <form id="congeForm" class="space-y-4">
                <div>
                    <label for="nom" class="block text-gray-700">Nom:</label>
                    <input type="text" id="nom" name="nom" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="prenom" class="block text-gray-700">Prenom:</label>
                    <input type="text" id="prenom" name="prenom" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="Second prenom" class="block text-gray-700">Second prenom:</label>
                    <input type="text" id="secondPrenom" name="secondPrenom" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="dateDebut" class="block text-gray-700">Date de début:</label>
                    <input type="date" id="dateDebut" name="dateDebut" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="dateFin" class="block text-gray-700">Date de fin:</label>
                    <input type="date" id="dateFin" name="dateFin" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="raison" class="block text-gray-700">Raison:</label>
                    <select id="raison" name="raison" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Choisir une raison</option>
                        <option value="Congé Payé">Congé Payé</option>
                        <option value="Congé sans solde">Congé sans solde</option>
                        <option value="Congé Parental">Congé Parental</option>
                        <option value="Autre">Autre</option>
                    </select>
                    <div id="autreRaisonContainer" class="hidden mt-2">
                        <label for="autreRaison" class="block text-gray-700">Précisez la raison:</label>
                        <textarea id="autreRaison" name="autreRaison" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Soumettre</button>
            </form>
            <button class="w-full text-center pt-1 mt-4 bg-white text-white rounded-md border-solid border-blue-500 hover:bg-gray-200" id="historiqueButton">
                <a href="historique.html" class="block mt-4 text-blue-500 hover:underline">Historique des demandes</a>
            </button>
            <a href="validation.html" class="block mt-4 text-blue-500 hover:underline">Aller à la validation des demandes</a>
        </div>
    </div>
        <button id="logoutButton" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50 hidden ml-2">
            Se déconnecter
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
